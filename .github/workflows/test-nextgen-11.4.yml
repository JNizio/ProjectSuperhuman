name: Test NextGen 11.4

on:
  push:
    branches: [ '11.4' ]
    paths:
      - 'nextgen/**'
      - '.github/workflows/test-nextgen-11.4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-nextgen-11-4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enforce Data Vault read boundaries
        run: python3 nextgen/scripts/check_data_boundaries.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run NextGen unit tests
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:testDebugUnitTest
