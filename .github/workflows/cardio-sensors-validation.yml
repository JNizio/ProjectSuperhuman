name: Cardio sensors validation

on:
  push:
    branches: [ cardio-sensors-healthconnect ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enforce Data Vault read boundaries
        run: python3 nextgen/scripts/check_data_boundaries.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Cardio sensor unit tests
        run: gradle --no-daemon --stacktrace -p nextgen :androidApp:testDebugUnitTest --tests 'com.projectsuperhuman.next.CardioSensorProcessingTest'

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace -p nextgen :androidApp:assembleDebug
