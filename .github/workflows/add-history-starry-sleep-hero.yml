name: Add history starry sleep hero

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/add-history-starry-sleep-hero.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch history screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          payload = ""
          hero = base64.b64decode(payload).decode()
          p = Path('nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepHistoryPage.kt')
          s = p.read_text()
          if 'import androidx.compose.ui.graphics.Brush' not in s:
              s = s.replace('import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Brush\nimport androidx.compose.ui.graphics.Color\n')
          if 'HistorySleepDashboardHero(nights)' not in s:
              s = s.replace('        HistoryHeader(onBack)\n        SleepCalendarCard(', '        HistoryHeader(onBack)\n        HistorySleepDashboardHero(nights)\n        SleepCalendarCard(')
          marker = '@Composable\nprivate fun HistoryHeader(onBack: () -> Unit) {'
          if 'private fun HistorySleepDashboardHero' not in s:
              s = s.replace(marker, hero + marker)
          p.write_text(s)
          gpath = Path('nextgen/androidApp/build.gradle.kts')
          g = gpath.read_text().replace('versionCode = 11007', 'versionCode = 11008').replace('versionName = "11.0.7"', 'versionName = "11.0.8"')
          gpath.write_text(g)
          PY
      - name: Commit history hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepHistoryPage.kt nextgen/androidApp/build.gradle.kts
          git commit -m "Add starry sleep dashboard to history and bump to 11.0.8"
          git push origin HEAD:main
