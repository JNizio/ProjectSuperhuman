name: Enrich sleep history hero

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/enrich-sleep-history-hero.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch routed sleep hero
        run: python3 .github/scripts/enrich_sleep_hero.py
      - name: Commit enriched hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepHistoryPage.kt nextgen/androidApp/build.gradle.kts
          git commit -m "Enrich starry sleep hero with prominent score and nightly metrics"
          git push origin HEAD:main
