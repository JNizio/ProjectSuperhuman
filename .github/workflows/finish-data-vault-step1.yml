name: Finish Data Vault Step 1

on:
  push:
    branches: ['11.2']
    paths:
      - '.github/workflows/finish-data-vault-step1.yml'
      - 'nextgen/shared/src/commonMain/sqldelight/com/projectsuperhuman/next/db/HealthStore.sq'
      - 'nextgen/shared/src/commonMain/kotlin/com/projectsuperhuman/next/data/SqlHealthRepository.kt'
      - 'nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NativeSleepParity.kt'
      - 'nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepHistoryPage.kt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finish-step-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11.2

      - name: Verify no Sleep all-values hot path remains
        shell: bash
        run: |
          ! grep -R "NativeDataHub.allValuesAsync" \
            nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NativeSleepParity.kt \
            nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepHistoryPage.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Android app
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:compileDebugKotlin
