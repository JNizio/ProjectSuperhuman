name: Apply native heart-rate analytics 11.2.17

on:
  push:
    branches: [ "11.2" ]
    paths:
      - '.github/workflows/apply-heart-rate-cpp-11.2.17.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 11.2
        uses: actions/checkout@v4
        with:
          ref: '11.2'

      - name: Wire advanced heart-rate UI and sync
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('nextgen/androidApp/src/main/java/com/projectsuperhuman/next/HomeMiniMetrics.kt')
          text = path.read_text()

          old_sync = "\n".join([
              "    suspend fun sync() {",
              "        syncing = true",
              "        val result = MiniMetricsHealthConnect.sync(context)",
              "        syncing = false",
              "        status = result.message",
              "        connected = permission != null && MiniMetricsHealthConnect.hasPermission(context, metric)",
              "        refresh()",
              "    }",
          ])
          new_sync = "\n".join([
              "    suspend fun sync() {",
              "        syncing = true",
              "        val result = MiniMetricsHealthConnect.sync(context)",
              "        val advanced = if (metric == HomeMiniMetric.HEART_RATE && result.success) {",
              "            HeartRateAdvancedHealthConnect.sync(context)",
              "        } else null",
              "        syncing = false",
              "        status = advanced?.message ?: result.message",
              "        connected = permission != null && MiniMetricsHealthConnect.hasPermission(context, metric)",
              "        refresh()",
              "    }",
          ])
          if old_sync not in text:
              raise SystemExit('Expected mini metric sync block not found')
          text = text.replace(old_sync, new_sync, 1)

          old_history = "\n".join([
              "            MiniMetricHistoryCard(metric, detail.history, accent)",
              "        }",
              "",
              "        if (metric != HomeMiniMetric.STRESS) {",
          ])
          new_history = "\n".join([
              "            MiniMetricHistoryCard(metric, detail.history, accent)",
              "            if (metric == HomeMiniMetric.HEART_RATE) {",
              "                AdvancedHeartRateSection(syncing = syncing, refreshSignal = status)",
              "            }",
              "        }",
              "",
              "        if (metric != HomeMiniMetric.STRESS) {",
          ])
          if old_history not in text:
              raise SystemExit('Expected history insertion point not found')
          text = text.replace(old_history, new_history, 1)

          path.write_text(text)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android native toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile 11.2.17 with C++
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug

      - name: Commit wired 11.2.17
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nextgen/androidApp/src/main/java/com/projectsuperhuman/next/HomeMiniMetrics.kt
          if git diff --cached --quiet; then
            echo "No wiring changes to commit"
          else
            git commit -m "Wire C++ heart-rate analytics into mini module"
            git push origin HEAD:11.2
          fi
