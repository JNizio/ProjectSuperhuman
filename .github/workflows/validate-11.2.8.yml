name: Validate Project Superhuman 11.2.12

on:
  push:
    branches: [ "11.2" ]
    paths:
      - '.github/workflows/validate-11.2.8.yml'

permissions:
  contents: read

# Final validation after finger anchoring, animated neighbour movement and live gesture callbacks.
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 11.2
        uses: actions/checkout@v4
        with:
          ref: '11.2'
      - name: Normalise Compose scoped APIs
        shell: bash
        run: |
          find nextgen/androidApp/src/main/java -name '*.kt' -type f -print0 | xargs -0 sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile 11.2.12
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug
