name: Fix Clinical Registry Type 11.2

on:
  push:
    branches: [ '11.2' ]
    paths:
      - '.github/workflows/fix-clinical-registry-type-112.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix legacy type references
        shell: bash
        run: |
          FILE='nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NativeClinicalParity.kt'
          sed -i 's/private fun markerDef(text: String): LabDef?/private fun markerDef(text: String): ClinicalMarkerDef?/g' "$FILE"
          sed -i 's/var best: Pair<LabDef, Double>?/var best: Pair<ClinicalMarkerDef, Double>?/g' "$FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'Fix Clinical full registry type wiring 11.2' || exit 0
          git push origin HEAD:11.2
