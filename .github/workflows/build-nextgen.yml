name: Build Project Superhuman 11

on:
  push:
    branches: [ main ]
    paths:
      - 'nextgen/**'
      - 'app/src/main/java/**'
      - 'app/src/main/res/**'
      - 'app/src/main/assets/**'
      - '.github/workflows/build-nextgen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nextgen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Normalise Compose scoped APIs
        shell: bash
        run: |
          find nextgen/androidApp/src/main/java -name '*.kt' -type f -print0 | xargs -0 sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d'
          if ! git diff --quiet -- nextgen/androidApp/src/main/java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nextgen/androidApp/src/main/java
            git commit -m "Fix Compose scoped weight imports [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Project Superhuman 11.0.0 validation APK
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug

      - name: Upload Project Superhuman 11.0.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSuperhuman-11.0.0-Validation
          path: nextgen/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
