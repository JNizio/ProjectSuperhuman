name: Build Project Superhuman 11

on:
  push:
    branches: [ main, '11.2' ]
    paths:
      - 'nextgen/**'
      - 'app/src/main/java/**'
      - 'app/src/main/res/**'
      - 'app/src/main/assets/**'
      - '.github/scripts/global_top_button_style.py'
      - '.github/workflows/build-nextgen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nextgen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply global top button style
        shell: bash
        run: |
          python3 .github/scripts/global_top_button_style.py
          sed -i 's/number\.absoluteValue/abs(number)/g' nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NativeClinicalParity.kt
          if ! git diff --quiet -- nextgen/androidApp/src/main/java nextgen/androidApp/build.gradle.kts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nextgen/androidApp/src/main/java nextgen/androidApp/build.gradle.kts
            git commit -m "Fix Clinical decoder compile 11.2.0 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Normalise Compose scoped APIs
        shell: bash
        run: |
          find nextgen/androidApp/src/main/java -name '*.kt' -type f -print0 | xargs -0 sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Project Superhuman 11.2.0 APK
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug

      - name: Verify APK was produced
        shell: bash
        run: test -s nextgen/androidApp/build/outputs/apk/debug/androidApp-debug.apk

      - name: Publish APK handoff release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="chatgpt-build-11.2"
          APK="nextgen/androidApp/build/outputs/apk/debug/androidApp-debug.apk"
          OUT="ProjectSuperhuman-11.2-debug.apk"
          cp "$APK" "$OUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT" --clobber
          else
            gh release create "$TAG" "$OUT" \
              --target "$GITHUB_SHA" \
              --title "Project Superhuman 11.2 build" \
              --notes "APK handoff build for Project Superhuman 11.2." \
              --prerelease
          fi
