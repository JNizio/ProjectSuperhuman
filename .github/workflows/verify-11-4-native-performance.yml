name: Verify native 11.4 performance-safe changes

on:
  push:
    branches: [ '11.4' ]
    paths:
      - 'nextgen/androidApp/**'
      - 'nextgen/shared/**'
      - 'nextgen/scripts/**'
      - 'app/src/main/**'
      - '.github/workflows/verify-11-4-native-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-regression-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Verify data-vault boundaries
        run: python3 nextgen/scripts/check_data_boundaries.py
      - name: Verify no-press-highlight policy
        run: python3 nextgen/scripts/check_no_press_highlight.py
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and compile native debug APK
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:testDebugUnitTest :androidApp:assembleDebug
      - name: Confirm APK output exists
        run: test -s nextgen/androidApp/build/outputs/apk/debug/androidApp-debug.apk
