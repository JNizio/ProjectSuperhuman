name: Trudy Kokoro Runtime

on:
  push:
    branches: [ 'trudy/kokoro-runtime' ]
    paths:
      - 'nextgen/androidApp/**'
      - 'nextgen/settings.gradle.kts'
      - 'nextgen/docs/TRUDY_VOICE_ARCHITECTURE.md'
      - '.github/workflows/trudy-kokoro-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Kokoro and Android unit tests
        run: gradle --no-daemon -p nextgen :androidApp:testDebugUnitTest

      - name: Compile Android debug APK
        run: gradle --no-daemon -p nextgen :androidApp:assembleDebug
