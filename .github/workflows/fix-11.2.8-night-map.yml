name: Fix Project Superhuman 11.2.8 calendar map conflict

on:
  push:
    branches: [ "11.2" ]
    paths:
      - '.github/workflows/fix-11.2.8-night-map.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 11.2
        uses: actions/checkout@v4
        with:
          ref: '11.2'
          fetch-depth: 0
      - name: Remove redundant calendar map
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepHistoryPage.kt')
          text = p.read_text()
          old = '    val nightByDate = nights.associateBy { it.wakeDate }\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one redundant nightByDate line, found {text.count(old)}')
          p.write_text(text.replace(old, '', 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepHistoryPage.kt
          git commit -m "Fix 11.2.8 sleep calendar map conflict [skip ci]"
          git push origin HEAD:11.2
