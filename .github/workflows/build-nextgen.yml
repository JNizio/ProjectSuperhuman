name: Build Project Superhuman 11

on:
  push:
    branches: [ agent/global-data-performance ]
    paths:
      - 'nextgen/**'
      - 'app/src/main/java/**'
      - 'app/src/main/res/**'
      - 'app/src/main/assets/**'
      - '.github/workflows/build-nextgen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nextgen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v4

      - name: Normalise Compose scoped APIs
        shell: bash
        run: |
          find nextgen/androidApp/src/main/java -name '*.kt' -type f -print0 | xargs -0 sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile performance APK
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug

      - name: Publish preview APK as prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APK=$(find nextgen/androidApp/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          TAG="performance-preview-${GITHUB_SHA::8}"
          cp "$APK" ProjectSuperhuman-Performance-Preview.apk
          gh release create "$TAG" ProjectSuperhuman-Performance-Preview.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Project Superhuman Performance Preview" \
            --notes "Compiled preview from the app-wide data performance optimization branch." \
            --prerelease
