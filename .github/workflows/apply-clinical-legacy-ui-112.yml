name: Apply Clinical Legacy UI 11.2

on:
  push:
    branches: [ '11.2' ]
    paths:
      - '.github/scripts/clinical_legacy_ui_112.py'
      - '.github/workflows/apply-clinical-legacy-ui-112.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply legacy-style native Clinical import UI
        run: python3 .github/scripts/clinical_legacy_ui_112.py
      - name: Commit UI transplant
        run: |
          if git diff --quiet -- nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NativeClinicalParity.kt; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NativeClinicalParity.kt
          git commit -m "Restore legacy-style Clinical import UI 11.2"
          git push origin HEAD:11.2
