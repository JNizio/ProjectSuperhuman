name: Apply home layout cleanup 11.2.14

on:
  push:
    branches: [ "11.2" ]
    paths:
      - '.github/workflows/apply-home-layout-11.2.14.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 11.2
        uses: actions/checkout@v4
        with:
          ref: '11.2'
      - name: Apply compact home layout
        shell: python
        run: |
          from pathlib import Path

          home = Path('nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NativeLiveHome.kt')
          text = home.read_text()
          text = text.replace('    NUTRITION("nutrition"),\n    QUICK_LINKS("quick_links"),\n    BLOOD_PRESSURE("blood_pressure")', '    NUTRITION("nutrition"),\n    BLOOD_PRESSURE("blood_pressure")')
          text = text.replace('    HomeTile.NUTRITION,\n    HomeTile.QUICK_LINKS,\n    HomeTile.BLOOD_PRESSURE', '    HomeTile.NUTRITION,\n    HomeTile.BLOOD_PRESSURE')
          text = text.replace('                            HomeTile.BODY -> LegacyBodyCard(snapshot, Modifier.fillMaxWidth(), openBody)', '                            HomeTile.BODY -> HomeBodyMindfulnessRow(snapshot, openBody, openMindfulness)')
          old = '''                            HomeTile.QUICK_LINKS -> LegacyHomeLinks(\n                                openMindfulness = openMindfulness,\n                                openExercise = openExercise,\n                                openInsights = openClinical\n                            )\n'''
          if old not in text:
              raise SystemExit('Legacy QUICK_LINKS block not found')
          text = text.replace(old, '')
          home.write_text(text)

          components = Path('nextgen/androidApp/src/main/java/com/projectsuperhuman/next/HomeDashboardComponents.kt')
          text = components.read_text()
          marker = '''@Composable\nprivate fun BodySparkline(values: List<Double>) {'''
          insert = '''@Composable\ninternal fun HomeBodyMindfulnessRow(\n    snapshot: NativeHomeSnapshot,\n    openBody: () -> Unit,\n    openMindfulness: () -> Unit\n) {\n    Row(\n        Modifier.fillMaxWidth(),\n        horizontalArrangement = Arrangement.spacedBy(12.dp)\n    ) {\n        LegacyBodyCard(snapshot, Modifier.weight(1f), openBody)\n        LegacyMindfulnessCard(snapshot, Modifier.weight(1f), openMindfulness)\n    }\n}\n\n@Composable\nprivate fun LegacyMindfulnessCard(\n    snapshot: NativeHomeSnapshot,\n    modifier: Modifier,\n    onClick: () -> Unit\n) {\n    val minutes = snapshot.mindfulnessMinutesToday\n    Column(\n        modifier.height(148.dp)\n            .clip(RoundedCornerShape(23.dp))\n            .background(Color(0xFFF4FAFB))\n            .border(1.dp, Color(0xFFDCECEF), RoundedCornerShape(23.dp))\n            .clickable(onClick = onClick)\n            .padding(15.dp)\n    ) {\n        LegacyCardHeader("MINDFULNESS")\n        Spacer(Modifier.height(8.dp))\n        Text(\n            if (minutes > 0) "$minutes min" else "Ready",\n            color = Color(0xFF176B72),\n            fontSize = 20.sp,\n            fontWeight = FontWeight.Black\n        )\n        Text(\n            if (minutes > 0) "mindful time today" else "Breathe · reflect · reset",\n            color = HomeMuted,\n            fontSize = 8.sp\n        )\n        Spacer(Modifier.height(13.dp))\n        Row(horizontalArrangement = Arrangement.spacedBy(5.dp), verticalAlignment = Alignment.Bottom) {\n            listOf(12, 20, 30, 22, 15).forEachIndexed { index, height ->\n                Box(\n                    Modifier.weight(1f)\n                        .height(height.dp)\n                        .background(\n                            if (minutes > 0 && index < 3) Color(0xFF5CB7AE) else Color(0xFFD9ECEB),\n                            RoundedCornerShape(8.dp)\n                        )\n                )\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun BodySparkline(values: List<Double>) {'''
          if marker not in text:
              raise SystemExit('BodySparkline marker not found')
          text = text.replace(marker, insert, 1)
          components.write_text(text)

          gradle = Path('nextgen/androidApp/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('versionCode = 11213', 'versionCode = 11214')
          text = text.replace('versionName = "11.2.13"', 'versionName = "11.2.14"')
          gradle.write_text(text)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile 11.2.14
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug
      - name: Commit 11.2.14
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NativeLiveHome.kt nextgen/androidApp/src/main/java/com/projectsuperhuman/next/HomeDashboardComponents.kt nextgen/androidApp/build.gradle.kts
          git diff --cached --quiet && exit 0
          git commit -m "Clean up home layout and add mindfulness half tile"
          git push origin HEAD:11.2
