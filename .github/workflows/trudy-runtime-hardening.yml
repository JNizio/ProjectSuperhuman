name: Trudy Runtime Hardening

on:
  push:
    branches: [ 'trudy/runtime-hardening' ]
    paths:
      - 'nextgen/shared/**'
      - 'nextgen/androidApp/**'
      - 'nextgen/scripts/check_data_boundaries.py'
      - '.github/workflows/trudy-runtime-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # This branch-only job is intentionally limited to architecture checks, tests, and compilation.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Data boundary guard
        run: python3 nextgen/scripts/check_data_boundaries.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Shared and Android unit tests
        run: gradle --no-daemon -p nextgen :shared:testDebugUnitTest :androidApp:testDebugUnitTest

      - name: Compile debug APK
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug
