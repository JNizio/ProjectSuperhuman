name: Trudy Quality V3 Integration CI

on:
  push:
    branches: [ 'integration/trudy-quality-v3' ]
    paths:
      - 'nextgen/**'
      - '.github/workflows/trudy-quality-v3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate medical corpus and Data Vault boundaries
        run: |
          python3 nextgen/scripts/validate_medical_corpus.py
          python3 nextgen/scripts/test_medical_retrieval.py
          python3 nextgen/scripts/check_data_boundaries.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and run Trudy tests
        run: gradle --no-daemon --build-cache -p nextgen :shared:testDebugUnitTest :androidApp:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug
