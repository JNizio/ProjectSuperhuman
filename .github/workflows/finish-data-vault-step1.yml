name: Data Vault Architecture Verify

on:
  push:
    branches: ['11.2']
    paths:
      - '.github/workflows/finish-data-vault-step1.yml'
      - 'nextgen/shared/build.gradle.kts'
      - 'nextgen/shared/src/commonMain/sqldelight/com/projectsuperhuman/next/db/HealthStore.sq'
      - 'nextgen/shared/src/commonMain/kotlin/com/projectsuperhuman/next/core/**'
      - 'nextgen/shared/src/commonMain/kotlin/com/projectsuperhuman/next/data/**'
      - 'nextgen/shared/src/commonTest/kotlin/com/projectsuperhuman/next/**'
      - 'nextgen/androidApp/src/main/java/com/projectsuperhuman/next/**'
      - 'nextgen/androidApp/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-data-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11.2

      - name: Verify no Sleep all-values hot path remains
        shell: bash
        run: |
          ! grep -R "NativeDataHub.allValuesAsync" \
            nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NativeSleepParity.kt \
            nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepHistoryPage.kt

      - name: Verify gateway implementation exists
        shell: bash
        run: |
          grep -q "class SqlDataVaultGateway" \
            nextgen/shared/src/commonMain/kotlin/com/projectsuperhuman/next/data/SqlDataVaultGateway.kt
          grep -q "gateway.module" \
            nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NativeDataHub.kt

      - name: Verify Step 3 ingestion boundary exists
        shell: bash
        run: |
          grep -q "object CoreMetricRegistry" \
            nextgen/shared/src/commonMain/kotlin/com/projectsuperhuman/next/core/MetricRegistry.kt
          grep -q "class DataIngestionPipeline" \
            nextgen/shared/src/commonMain/kotlin/com/projectsuperhuman/next/core/IngestionPipeline.kt
          grep -q "ingestion.ingestValues" \
            nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NativeDataHub.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run shared regression tests
        run: gradle --no-daemon --build-cache -p nextgen :shared:testDebugUnitTest

      - name: Compile Android app
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:compileDebugKotlin

      - name: Assemble full debug APK
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug

      - name: Verify APK was produced
        shell: bash
        run: test -s nextgen/androidApp/build/outputs/apk/debug/androidApp-debug.apk
