name: Build sleep 11.2.3

on:
  push:
    branches: ['11.2']
    paths:
      - '.github/scripts/sleep_1123_multisession.py'
      - '.github/workflows/build-sleep-1123.yml'
      - 'nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepNightDashboardHero.kt'
      - 'nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepIntelligenceEngine.kt'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply 11.2.3 multi-session sleep changes
        run: python3 .github/scripts/sleep_1123_multisession.py

      - name: Commit sleep changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepIntelligenceEngine.kt \
                    nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepNightDashboardHero.kt \
                    nextgen/androidApp/build.gradle.kts
            git commit -m "Handle split sleep sessions in 11.2.3 [skip ci]"
            git push origin HEAD:11.2
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build 11.2.3 APK
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug

      - name: Publish 11.2.3 APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APK=$(find nextgen/androidApp/build/outputs/apk/debug -name '*.apk' | head -n 1)
          cp "$APK" ProjectSuperhuman-11.2.3.apk
          gh release view v11.2.3 >/dev/null 2>&1 || gh release create v11.2.3 --title "Project Superhuman 11.2.3" --notes "Split-sleep accuracy update: separate sleep blocks, interruption-aware scoring, and both Sleep time and Actual sleep shown."
          gh release upload v11.2.3 ProjectSuperhuman-11.2.3.apk --clobber

      - name: Prune old Project Superhuman APK artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req) as r:
              artifacts = json.load(r).get('artifacts', [])

          apk_artifacts = [
              a for a in artifacts
              if not a.get('expired', False)
              and (
                  'ProjectSuperhuman' in a.get('name', '')
                  or 'APK' in a.get('name', '').upper()
                  or 'apk' in a.get('name', '').lower()
              )
          ]
          apk_artifacts.sort(key=lambda a: a.get('created_at', ''), reverse=True)

          # Keep the two newest APK artifacts as a rollback buffer.
          for artifact in apk_artifacts[2:]:
              aid = artifact['id']
              name = artifact.get('name', str(aid))
              print(f'Deleting old APK artifact: {name} ({aid})')
              subprocess.run(
                  ['gh', 'api', '--method', 'DELETE', f'/repos/{repo}/actions/artifacts/{aid}'],
                  check=True,
              )
          PY
