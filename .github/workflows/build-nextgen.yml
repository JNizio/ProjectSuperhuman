name: Build Project Superhuman NextGen

on:
  push:
    branches: [ main ]
    paths:
      - 'nextgen/**'
      - 'app/src/main/java/**'
      - 'app/src/main/res/**'
      - 'app/src/main/assets/**'
      - '.github/workflows/build-nextgen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nextgen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile native release candidate
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug

      - name: Upload installable Step 19 APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSuperhuman-Step19-RC1
          path: nextgen/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
