name: Cardio live sensors verification

on:
  push:
    branches:
      - cardio-nof1-live-sensors
  workflow_dispatch:

concurrency:
  group: cardio-nof1-live-sensors-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce Data Vault boundaries
        run: python3 nextgen/scripts/check_data_boundaries.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Cardio live/sensor unit tests
        run: >
          gradle --no-daemon --stacktrace -p nextgen :androidApp:testDebugUnitTest
          --tests 'com.projectsuperhuman.next.CardioLiveExecutionTest'
          --tests 'com.projectsuperhuman.next.CardioSensorProcessingTest'
          --tests 'com.projectsuperhuman.next.CardioCoreReliabilityTest'
