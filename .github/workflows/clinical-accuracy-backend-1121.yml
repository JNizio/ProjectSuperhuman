name: Clinical accuracy backend 11.2.1

on:
  push:
    branches: ['11.2']
    paths:
      - '.github/workflows/clinical-accuracy-backend-1121.yml'
      - '.github/scripts/clinical_accuracy_backend_1121.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply hidden Clinical accuracy improvements
        run: python3 .github/scripts/clinical_accuracy_backend_1121.py

      - name: Commit backend changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NativeClinicalParity.kt; then
            git add nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NativeClinicalParity.kt
            git commit -m "Strengthen hidden Clinical OCR accuracy 11.2.1 [skip ci]"
            git push origin HEAD:11.2
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build accuracy-enhanced 11.2.1 APK
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug

      - name: Upload accuracy-enhanced 11.2.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSuperhuman-11.2.1-ClinicalAccuracyBackend
          path: nextgen/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
