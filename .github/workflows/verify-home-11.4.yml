name: Verify Project Superhuman 11.4 home

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure permanent update signing
        shell: bash
        run: |
          echo "SUPERHUMAN_SIGNING_STORE_FILE=../../signing/project-superhuman-v97.keystore" >> "$GITHUB_ENV"
          echo "SUPERHUMAN_SIGNING_KEY_ALIAS=project-superhuman" >> "$GITHUB_ENV"
          password="$(sed -n 's/^Store\/key password: //p' signing/README_SIGNING_v9.7.txt)"
          test -n "$password"
          echo "::add-mask::$password"
          echo "SUPERHUMAN_SIGNING_STORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SUPERHUMAN_SIGNING_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Compile Android debug APK
        run: gradle --no-daemon -p nextgen :androidApp:assembleDebug

      - name: Verify output and signature
        shell: bash
        run: |
          APK=nextgen/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload installable debug build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSuperhuman-11.4-home-debug
          path: nextgen/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 5
          if-no-files-found: error

      - name: Publish signed APK to GitHub Releases
        if: github.ref == 'refs/heads/11.4'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="project-superhuman-11.4-mini-$(git rev-parse --short=10 HEAD)"
          cp nextgen/androidApp/build/outputs/apk/debug/androidApp-debug.apk ProjectSuperhuman-11.4-FlatMini.apk
          gh release create "$TAG" ProjectSuperhuman-11.4-FlatMini.apk \
            --target "$GITHUB_SHA" \
            --title "Project Superhuman 11.4 - Flat dashboard and compact modules" \
            --notes "Android debug build signed with the project's permanent update key. Includes the flat dashboard and paired Hydration/Environment mini modules. Back up your data before uninstalling any existing app."
