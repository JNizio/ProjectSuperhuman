name: Cardio n-of-1 analytics validation

on:
  push:
    branches:
      - cardio-nof1-analytics-intelligence
    paths:
      - 'nextgen/androidApp/src/main/java/com/projectsuperhuman/next/cardio/**'
      - 'nextgen/androidApp/src/test/java/com/projectsuperhuman/next/CardioIntelligenceEngineTest.kt'
      - 'nextgen/shared/src/commonMain/kotlin/com/projectsuperhuman/next/core/MetricRegistry.kt'
      - '.github/workflows/cardio-nof1-analytics-validation.yml'
  workflow_dispatch:

concurrency:
  group: cardio-nof1-analytics-intelligence-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Android main sources
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:compileDebugKotlin

      - name: Run Cardio intelligence unit tests
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:testDebugUnitTest --tests 'com.projectsuperhuman.next.CardioIntelligenceEngineTest'
