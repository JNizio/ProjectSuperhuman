name: Build Project Superhuman APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 8 for F# science engine
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate F# scientific core
        run: dotnet run --project science/fsharp/ScientificCore.Tests/ScientificCore.Tests.fsproj --configuration Release

      - name: Validate Python research model
        run: python3 science/python/validate_engine.py

      - name: Validate Rust scientific primitives
        run: cargo test --manifest-path science/rust/Cargo.toml --release

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSuperhuman-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
