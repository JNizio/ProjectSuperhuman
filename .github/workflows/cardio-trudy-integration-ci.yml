name: Cardio Trudy integration verification

on:
  push:
    branches:
      - cardio-nof1-trudy-integration
    paths:
      - 'nextgen/**'
      - '.github/workflows/cardio-trudy-integration-ci.yml'
  workflow_dispatch:

concurrency:
  group: cardio-nof1-trudy-integration-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce Data Vault read boundaries
        run: python3 nextgen/scripts/check_data_boundaries.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run shared and Android unit tests
        run: gradle --no-daemon -p nextgen :shared:testDebugUnitTest :androidApp:testDebugUnitTest

      - name: Compile Android debug Kotlin
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:compileDebugKotlin
