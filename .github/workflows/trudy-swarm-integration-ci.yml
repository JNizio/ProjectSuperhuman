name: Trudy Swarm Integration CI

on:
  push:
    branches: [ 'integration/trudy-knowledge-voice-v2' ]
    paths:
      - 'nextgen/**'
      - '.github/workflows/trudy-swarm-integration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-trudy-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Validate medical corpus and retrieval
        run: |
          python3 nextgen/scripts/validate_medical_corpus.py
          python3 nextgen/scripts/test_medical_retrieval.py
          python3 nextgen/scripts/check_data_boundaries.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run shared and Android Trudy tests
        run: gradle --no-daemon --build-cache -p nextgen :shared:testDebugUnitTest :androidApp:testDebugUnitTest

      - name: Compile debug APK
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug
