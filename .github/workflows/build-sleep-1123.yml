name: Build sleep 11.2.3

on:
  push:
    branches: ['11.2']
    paths:
      - '.github/scripts/sleep_1123_multisession.py'
      - '.github/workflows/build-sleep-1123.yml'
      - 'nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepNightDashboardHero.kt'
      - 'nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepIntelligenceEngine.kt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply 11.2.3 multi-session sleep changes
        run: python3 .github/scripts/sleep_1123_multisession.py

      - name: Commit sleep changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepIntelligenceEngine.kt \
                    nextgen/androidApp/src/main/java/com/projectsuperhuman/next/SleepNightDashboardHero.kt \
                    nextgen/androidApp/build.gradle.kts
            git commit -m "Handle split sleep sessions in 11.2.3 [skip ci]"
            git push origin HEAD:11.2
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build 11.2.3 APK
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug

      - name: Upload 11.2.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSuperhuman-11.2.3-SplitSleep
          path: nextgen/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
