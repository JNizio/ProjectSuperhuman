name: Verify Project Superhuman 11.4 home

on:
  push:
    branches: ['11.4']
    paths:
      - 'nextgen/**'
      - '.github/workflows/verify-home-11.4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Android debug APK
        run: gradle --no-daemon -p nextgen :androidApp:assembleDebug

      - name: Verify output
        run: test -s nextgen/androidApp/build/outputs/apk/debug/androidApp-debug.apk

      - name: Upload installable debug build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSuperhuman-11.4-home-debug
          path: nextgen/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 5
          if-no-files-found: error
