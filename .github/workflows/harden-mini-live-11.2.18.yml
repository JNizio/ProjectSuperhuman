name: Harden foreground mini-metric refresh 11.2.18

on:
  push:
    branches: [ "11.2" ]
    paths:
      - '.github/workflows/harden-mini-live-11.2.18.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 11.2
        uses: actions/checkout@v4
        with:
          ref: '11.2'

      - name: Apply foreground lifecycle hardening
        run: python3 scripts/harden_mini_live_11_2_18.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile hardened 11.2.18
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug

      - name: Commit hardened 11.2.18
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nextgen/androidApp/src/main/java/com/projectsuperhuman/next/HomeMiniMetrics.kt
          if git diff --cached --quiet; then
            echo "No hardening changes to commit"
          else
            git commit -m "Keep mini metric polling foreground only"
            git push origin HEAD:11.2
          fi