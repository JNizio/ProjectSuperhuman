name: Apply Fit3 sync hardening 11.2.20

on:
  push:
    branches: [ "11.2" ]
    paths:
      - '.github/workflows/apply-fit3-sync-11.2.20.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 11.2
        uses: actions/checkout@v4
        with:
          ref: '11.2'

      - name: Apply Fit3 sync hardening
        run: python3 scripts/apply_fit3_sync_11_2_20.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile 11.2.20
        run: gradle --no-daemon --build-cache -p nextgen :androidApp:assembleDebug

      - name: Commit 11.2.20
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            nextgen/androidApp/src/main/java/com/projectsuperhuman/next/HomeMiniMetrics.kt \
            nextgen/androidApp/src/main/java/com/projectsuperhuman/next/MiniMetricsHealthConnect.kt \
            nextgen/androidApp/src/main/java/com/projectsuperhuman/next/MiniMetricsBackgroundSync.kt \
            nextgen/androidApp/src/main/java/com/projectsuperhuman/next/NextShellActivity.kt \
            nextgen/androidApp/src/main/AndroidManifest.xml \
            nextgen/androidApp/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No Fit3 sync changes to commit"
          else
            git commit -m "Harden Fit3 wearable sync and active calories"
            git push origin HEAD:11.2
          fi
